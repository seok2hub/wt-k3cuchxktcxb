<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121418">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WOD 타이머">
<!-- 홈 화면 앱: 상태 표시줄 뒤까지 화면을 쓰고, 내용은 safe-area 여백으로 보호 -->
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>WOD 타이머</title>
<style>
  :root {
    --font: "Segoe UI", Roboto, "Helvetica Neue", Arial, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    --s-bg: #121418; --s-card: #1d2027; --s-line: #2e323c; --s-fg: #f1f2f4; --s-dim: #9aa0ab;
    --accent: #1fb257;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font); background: var(--s-bg); color: var(--s-fg);
    -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  svg.i { width: 1.25em; height: 1.25em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; flex: none; }

  /* ---------- 설정 화면 ---------- */
  #setup {
    min-height: 100%;
    padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
             calc(32px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  .ver { color: var(--s-dim); font-size: 12px; text-align: center; opacity: .7; margin-top: 6px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .sh { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 18px; }
  .sh h1 { font-size: 26px; margin: 0; letter-spacing: -0.01em; }
  .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--s-card); border: 1px solid var(--s-line); border-radius: 999px; padding: 8px 14px; font-size: 15px; }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; background: var(--s-card); border: 1px solid var(--s-line); border-radius: 14px; padding: 6px; }
  .tabs button { border: 0; background: transparent; border-radius: 10px; padding: 12px 4px; font-size: 15px; font-weight: 600; color: var(--s-dim); white-space: nowrap; }
  .tabs button[aria-selected="true"] { background: var(--accent); color: #fff; }
  .card { background: var(--s-card); border: 1px solid var(--s-line); border-radius: 16px; padding: 18px; margin-top: 14px; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field .fl { font-size: 14px; color: var(--s-dim); }
  .tin { display: flex; align-items: center; gap: 6px; font-size: 15px; color: var(--s-dim); }
  .tin input { width: 100%; min-width: 0; flex: 1; font: inherit; font-size: 22px; font-weight: 700; color: var(--s-fg); background: var(--s-bg); border: 1px solid var(--s-line); border-radius: 10px; padding: 10px 10px; text-align: center; font-variant-numeric: tabular-nums; }
  .tin input:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .field.wide { grid-column: 1 / -1; }
  .preview { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--s-line); }
  .preview .tot { font-size: 18px; }
  .preview .tot strong { font-size: 34px; font-variant-numeric: tabular-nums; margin-left: 6px; }
  .preview .sub { color: var(--s-dim); font-size: 14px; margin-top: 4px; line-height: 1.5; }
  .start { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; margin-top: 14px; padding: 18px; font-size: 22px; font-weight: 800; border: 0; border-radius: 16px; background: var(--accent); color: #fff; }
  .start:active { transform: translateY(1px); }
  .presets h2 { font-size: 16px; margin: 0 0 12px; }
  .psave { display: flex; gap: 8px; }
  .psave input { flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--s-fg); background: var(--s-bg); border: 1px solid var(--s-line); border-radius: 10px; padding: 10px 12px; }
  .psave button, .plist button { border: 1px solid var(--s-line); background: var(--s-bg); border-radius: 10px; padding: 10px 14px; font-size: 15px; white-space: nowrap; }
  .plist { list-style: none; margin: 12px 0 0; padding: 0; }
  .plist li { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--s-line); }
  .plist .pn { flex: 1; min-width: 0; }
  .plist .pn b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .pn span { color: var(--s-dim); font-size: 13px; }
  .plist .empty { color: var(--s-dim); font-size: 14px; border: 0; }
  .plist button.del { color: #ff8a8a; }
  .hint { color: var(--s-dim); font-size: 13px; text-align: center; margin-top: 18px; }
  @media (max-width: 560px) {
    .tabs { grid-template-columns: repeat(3, 1fr); }
    .tabs button { font-size: 14px; padding: 10px 2px; }
    .fields { grid-template-columns: 1fr; }
  }

  /* ---------- 시작 화면 "Are You Ready?" ---------- */
  .ready, .bye { position: fixed; inset: 0; z-index: 50; user-select: none; -webkit-user-select: none; cursor: pointer; outline: none; }
  /* 보색 두 가지: 노랑 ↔ 남보라. 위/아래가 서로 반대 색, .swap 으로 맞바뀜 */
  .ready { --c1: #ffd400; --c2: #3b2bd9; display: flex; flex-direction: column; }
  .ready.swap { --c1: #3b2bd9; --c2: #ffd400; }
  .ready .half {
    flex: 1; display: flex; justify-content: center; text-align: center;
    font-weight: 900; font-size: min(17vw, 15vh); line-height: 1; letter-spacing: -0.02em;
    padding-left: max(16px, env(safe-area-inset-left)); padding-right: max(16px, env(safe-area-inset-right));
  }
  .ready .top { background: var(--c1); color: var(--c2); align-items: flex-end; padding-top: env(safe-area-inset-top); padding-bottom: 1.5vh; }
  .ready .bottom { background: var(--c2); color: var(--c1); align-items: flex-start; padding-top: 1.5vh; }
  /* '동작 줄이기' 켜짐: 깜빡임 대신 천천히 색이 바뀜 */
  .ready.slow .half { transition: background-color 3s ease, color 3s ease; }
  .ready .rhint {
    position: absolute; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom));
    text-align: center; font-size: clamp(15px, 2vw, 22px); font-weight: 700; color: var(--c1); opacity: .85; margin: 0; pointer-events: none;
  }
  .ready.slow .rhint { transition: color 3s ease; }
  .no {
    position: absolute; right: max(16px, env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom));
    min-width: 96px; min-height: 56px; padding: 0 28px; border-radius: 16px;
    border: 2px solid rgba(0,0,0,.25); background: #fff; color: #111; font-size: 22px; font-weight: 800;
  }
  .bye {
    background: #0b0c0f; color: #e8e8ea; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
    padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    animation: fadein .8s ease;
  }
  .bye .bye-t { font-size: clamp(30px, 7vw, 84px); font-weight: 800; line-height: 1.15; }
  .bye .bye-s { font-size: clamp(14px, 2vw, 20px); color: #8b909a; line-height: 1.6; }
  @keyframes fadein { from { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .bye { animation: none; } }

  /* ---------- 실행 화면 ---------- */
  body[data-phase="idle"]    { --bg: #1b1d22; --fg: #ffffff; }
  body[data-phase="prep"]    { --bg: #f2c200; --fg: #151515; }
  body[data-phase="work"]    { --bg: #149a43; --fg: #ffffff; }
  body[data-phase="rest"],
  body[data-phase="setRest"] { --bg: #d32f2f; --fg: #ffffff; }
  body[data-phase="done"]    { --bg: #1e5bd6; --fg: #ffffff; }
  #run {
    position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto;
    background: var(--bg); color: var(--fg); transition: background-color .25s;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
    user-select: none; -webkit-user-select: none; overflow: hidden;
  }
  .top { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; }
  .tl { display: flex; align-items: center; gap: 10px; justify-self: start; min-width: 0; }
  .tr { display: flex; align-items: center; gap: 10px; justify-self: end; }
  .tc { text-align: center; }
  .rb { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: clamp(44px, 5.5vw, 64px); min-width: clamp(44px, 5.5vw, 64px); padding: 0 12px; border-radius: 14px; border: 0; background: rgba(0,0,0,.18); font-size: clamp(16px, 1.6vw, 22px); font-weight: 700; }
  .rb:hover { background: rgba(0,0,0,.28); }
  .rb svg.i { width: clamp(22px, 2.2vw, 30px); height: clamp(22px, 2.2vw, 30px); }
  .rb.main { background: rgba(255,255,255,.92); color: #111; padding: 0 18px; }
  .rb.main:hover { background: #fff; }
  .info { min-width: 0; line-height: 1.2; }
  .info .mn { font-size: clamp(14px, 1.5vw, 22px); font-weight: 700; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .tt { font-size: clamp(18px, 2.4vw, 36px); font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .phase { font-size: clamp(30px, 6vw, 96px); font-weight: 900; line-height: 1; letter-spacing: -0.01em; white-space: nowrap; }
  .pz { display: inline-block; margin-top: 6px; font-size: clamp(13px, 1.4vw, 20px); font-weight: 700; padding: 3px 12px; border-radius: 999px; background: rgba(0,0,0,.25); }
  .big {
    display: flex; align-items: center; justify-content: center; min-height: 0;
    font-size: min(31vw, 60vh); font-weight: 800; line-height: .9; letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums; white-space: nowrap; cursor: pointer;
  }
  .big.long { font-size: min(19vw, 48vh); }
  #run.paused .big span { animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .35; } }
  .bottom { display: grid; grid-template-columns: 1fr 1.4fr 1fr; align-items: end; gap: 12px; }
  .stat .lb { font-size: clamp(13px, 1.6vw, 24px); font-weight: 700; opacity: .8; }
  .stat .vl { font-size: clamp(34px, 6.5vw, 110px); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .stat .vs { font-size: clamp(12px, 1.3vw, 20px); font-weight: 700; opacity: .75; font-variant-numeric: tabular-nums; min-height: 1.2em; }
  .stat.c { text-align: center; }
  .stat.c .vl { font-size: clamp(22px, 4vw, 66px); padding-bottom: .1em; white-space: nowrap; }
  .stat.r { text-align: right; }
  @media (max-width: 700px) and (orientation: portrait) {
    .top { grid-template-columns: 1fr auto; grid-template-areas: "tl tr" "tc tc"; row-gap: 14px; }
    .tl { grid-area: tl; } .tr { grid-area: tr; } .tc { grid-area: tc; }
    .tl, .tr { gap: 6px; }
    .rb { padding: 0 8px; }
    .rb .txt { display: none; }
    .big { font-size: 35vw; }
    .big.long { font-size: 22vw; }
  }
  @media (max-height: 480px) and (orientation: landscape) {
    #run { padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
    .rb { height: 40px; min-width: 40px; }
    .rb .txt { display: none; }
    .phase { font-size: 30px; }
    .big { font-size: min(31vw, 58vh); }
    .stat .vl { font-size: 32px; }
    .stat.c .vl { font-size: 22px; }
  }
</style>
</head>
<body data-phase="idle">

<!-- ================= 시작 화면 ================= -->
<section id="ready" class="ready" role="button" tabindex="0" aria-label="Are You Ready? 화면을 누르면 타이머로 이동합니다">
  <div class="half top"><span>Are You</span></div>
  <div class="half bottom"><span>Ready?</span></div>
  <p class="rhint">화면을 누르면 시작</p>
  <button class="no" id="noBtn" type="button">No</button>
</section>
<section id="bye" class="bye" role="button" tabindex="0" hidden>
  <div class="bye-t">Come back when you're ready</div>
  <div class="bye-s">준비되면 다시 만나요<br>화면을 누르면 처음으로 돌아갑니다</div>
</section>

<!-- ================= 설정 화면 ================= -->
<section id="setup" hidden>
  <div class="wrap">
    <header class="sh">
      <h1>WOD 타이머</h1>
      <button class="chip" id="soundSetup" type="button"></button>
    </header>

    <div class="tabs" id="tabs" role="tablist" aria-label="운동 모드"></div>

    <div class="card">
      <div class="fields" id="fields"></div>
      <div class="preview" id="preview" aria-live="polite"></div>
    </div>

    <button class="start" id="startBtn" type="button">
      <svg class="i" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></svg> 시작
    </button>

    <div class="card presets">
      <h2>저장된 설정</h2>
      <div class="psave">
        <input id="presetName" type="text" maxlength="30" placeholder="이름 (예: 월요일 인터벌)" autocomplete="off">
        <button id="presetSave" type="button">현재 설정 저장</button>
      </div>
      <ul class="plist" id="presetList"></ul>
    </div>

    <p class="hint">스페이스 = 시작/일시정지 · R = 리셋 · F = 전체 화면</p>
    <p class="ver" id="verText"></p>
  </div>
</section>

<!-- ================= 실행 화면 ================= -->
<section id="run" hidden>
  <div class="top">
    <div class="tl">
      <button class="rb" id="resetBtn" type="button" title="리셋 (R)" aria-label="리셋">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 2.7-6.4L3 8"/><path d="M3 3v5h5"/></svg>
      </button>
      <button class="rb" id="backBtn" type="button" title="설정" aria-label="설정으로">
        <svg class="i" viewBox="0 0 24 24"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
      </button>
      <div class="info">
        <div class="mn" id="modeName"></div>
        <div class="tt" id="totalText"></div>
      </div>
    </div>
    <div class="tc">
      <div class="phase" id="phaseName"></div>
      <div class="pz" id="pausedTag" hidden>일시정지</div>
    </div>
    <div class="tr">
      <button class="rb" id="soundRun" type="button" title="소리 켜기/끄기"></button>
      <button class="rb" id="fsBtn" type="button" title="전체 화면 (F)" aria-label="전체 화면">
        <svg class="i" viewBox="0 0 24 24"><path d="M3 9V3h6M21 9V3h-6M3 15v6h6M21 15v6h-6"/></svg>
      </button>
      <button class="rb" id="finishBtn" type="button" title="기록 완료" hidden>
        <svg class="i" viewBox="0 0 24 24"><path d="M4 12l5 5L20 6"/></svg><span class="txt">완료</span>
      </button>
      <button class="rb main" id="playBtn" type="button"></button>
    </div>
  </div>

  <div class="big" id="bigWrap" title="눌러서 시작/일시정지"><span id="bigTime">00:00</span></div>

  <div class="bottom">
    <div class="stat">
      <div class="lb">남은 라운드</div>
      <div class="vl" id="roundsLeft">—</div>
      <div class="vs" id="roundSub"></div>
    </div>
    <div class="stat c">
      <div class="lb">다음</div>
      <div class="vl" id="nextText">—</div>
    </div>
    <div class="stat r">
      <div class="lb">남은 사이클</div>
      <div class="vl" id="cyclesLeft">—</div>
      <div class="vs" id="cycleSub"></div>
    </div>
  </div>
</section>

<!-- ================= 타이머 엔진 (DOM과 무관, 테스트 가능) ================= -->
<script id="engine">
(function (root) {
  'use strict';
  var MODES = ['tabata', 'emom', 'amrap', 'fortime', 'custom'];
  var MODE_NAMES = { tabata: '타바타', emom: 'EMOM', amrap: 'AMRAP', fortime: 'For Time', custom: '사용자 지정' };
  var LABELS = { prep: '준비', work: '운동', rest: '휴식', setRest: '사이클 휴식', done: '완료' };
  var DEFAULTS = {
    mode: 'tabata', prep: 10,
    tabata: { work: 20, rest: 10, rounds: 8 },
    emom: { interval: 60, total: 600 },
    amrap: { time: 720 },
    fortime: { cap: 1200 },
    custom: { work: 40, rest: 20, rounds: 5, cycles: 3, cycleRest: 60 }
  };
  var MAXT = 24 * 3600;

  function int(v, min, max, def) {
    v = Math.floor(Number(v));
    if (!isFinite(v)) v = def;
    return Math.min(max, Math.max(min, v));
  }

  // 어떤 입력이 와도 유효한 설정 객체로 정리
  function normalize(s) {
    s = s || {};
    function g(m, k) { return (s[m] && s[m][k] !== undefined && s[m][k] !== '') ? s[m][k] : DEFAULTS[m][k]; }
    return {
      mode: MODES.indexOf(s.mode) >= 0 ? s.mode : DEFAULTS.mode,
      prep: int(s.prep === undefined || s.prep === '' ? DEFAULTS.prep : s.prep, 0, 3600, DEFAULTS.prep),
      tabata: { work: int(g('tabata', 'work'), 1, MAXT, 20), rest: int(g('tabata', 'rest'), 0, MAXT, 10), rounds: int(g('tabata', 'rounds'), 1, 999, 8) },
      emom: { interval: int(g('emom', 'interval'), 1, MAXT, 60), total: int(g('emom', 'total'), 1, MAXT, 600) },
      amrap: { time: int(g('amrap', 'time'), 1, MAXT, 720) },
      fortime: { cap: int(g('fortime', 'cap'), 0, MAXT, 1200) },
      custom: {
        work: int(g('custom', 'work'), 1, MAXT, 40), rest: int(g('custom', 'rest'), 0, MAXT, 20),
        rounds: int(g('custom', 'rounds'), 1, 999, 5), cycles: int(g('custom', 'cycles'), 1, 99, 3),
        cycleRest: int(g('custom', 'cycleRest'), 0, MAXT, 60)
      }
    };
  }

  // 설정 → 구간 목록. 시간 단위는 ms.
  function buildSchedule(input) {
    var s = normalize(input), m = s.mode, segs = [];
    var totalRounds = null, totalCycles = null, countUp = false, r, c, cfg;
    function add(type, sec, round, cycle) { if (sec > 0) segs.push({ type: type, dur: sec * 1000, round: round, cycle: cycle }); }

    add('prep', s.prep, 0, 1);
    if (m === 'tabata') {
      cfg = s.tabata; totalRounds = cfg.rounds;
      for (r = 1; r <= cfg.rounds; r++) { add('work', cfg.work, r, 1); if (r < cfg.rounds) add('rest', cfg.rest, r, 1); }
    } else if (m === 'emom') {
      cfg = s.emom; totalRounds = Math.max(1, Math.floor(cfg.total / cfg.interval));
      for (r = 1; r <= totalRounds; r++) add('work', cfg.interval, r, 1);
    } else if (m === 'amrap') {
      add('work', s.amrap.time, 1, 1);
    } else if (m === 'fortime') {
      countUp = true;
      segs.push({ type: 'work', dur: s.fortime.cap > 0 ? s.fortime.cap * 1000 : Infinity, round: 1, cycle: 1 });
    } else if (m === 'custom') {
      cfg = s.custom; totalRounds = cfg.rounds; totalCycles = cfg.cycles;
      for (c = 1; c <= cfg.cycles; c++) {
        for (r = 1; r <= cfg.rounds; r++) { add('work', cfg.work, r, c); if (r < cfg.rounds) add('rest', cfg.rest, r, c); }
        if (c < cfg.cycles) add('setRest', cfg.cycleRest, cfg.rounds, c);
      }
    }
    var t = 0;
    for (var i = 0; i < segs.length; i++) { segs[i].start = t; t += segs[i].dur; }
    var prepMs = s.prep * 1000;
    return { settings: s, mode: m, segs: segs, total: t, prepMs: prepMs, workTotal: t - prepMs,
             totalRounds: totalRounds, totalCycles: totalCycles, countUp: countUp };
  }

  // 경과 시간(ms) → 화면에 필요한 모든 상태
  function stateAt(sch, e) {
    var R = sch.totalRounds, C = sch.totalCycles, segs = sch.segs;
    if (e < 0) e = 0;
    if (e >= sch.total) {

    var h = '';
    presets.forEach(function (p, i) {
      var d = E.describe(presetSettings(p));
      h += '<li><div class="pn"><b>' + esc(p.name) + '</b><span>' + E.MODE_NAMES[p.mode] + ' · ' +
           (isFinite(d.workTotal) ? E.fmtShort(d.workTotal) : '상한 없음') + '</span></div>' +
           '<button type="button" data-load="' + i + '">불러오기</button>' +
           '<button type="button" class="del" data-del="' + i + '" aria-label="' + esc(p.name) + ' 삭제">삭제</button></li>';
    });
    $('presetList').innerHTML = h;
  }
  $('presetSave').addEventListener('click', function () {
    readFields();
    var name = $('presetName').value.trim();
    if (!name) { $('presetName').focus(); $('presetName').placeholder = '이름을 먼저 입력하세요'; return; }
    var p = { name: name, mode: settings.mode, prep: settings.prep, values: Object.assign({}, settings[settings.mode]) };
    var idx = -1;
    presets.forEach(function (q, i) { if (q.name === name) idx = i; });
    if (idx >= 0) { if (!confirm('"' + name + '" 설정이 이미 있습니다. 덮어쓸까요?')) return; presets[idx] = p; }
    else presets.push(p);
    store.set(KEY_PRESETS, presets);
    $('presetName').value = '';
    renderPresets();
  });
  $('presetName').addEventListener('keydown', function (ev) { if (ev.key === 'Enter') $('presetSave').click(); });
  $('presetList').addEventListener('click', function (ev) {
    var b = ev.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-load')) {
      var p = presets[+b.getAttribute('data-load')]; if (!p) return;
      settings = presetSettings(p); saveSettings(); renderSetup();
    } else if (b.hasAttribute('data-del')) {
      var i = +b.getAttribute('data-del'), q = presets[i]; if (!q) return;
      if (!confirm('"' + q.name + '" 설정을 삭제할까요?')) return;
      presets.splice(i, 1); store.set(KEY_PRESETS, presets); renderPresets();
    }
  });

  // ---------- 버튼 ----------
  function onClick(id, fn) { $(id).addEventListener('click', function (ev) { fn(ev); this.blur(); }); }
  onClick('startBtn', function () { readFields(); showRun(); });
  onClick('soundSetup', toggleSound);
  onClick('soundRun', toggleSound);
  onClick('resetBtn', reset);
  onClick('backBtn', showSetup);
  onClick('fsBtn', toggleFullscreen);
  onClick('playBtn', toggle);
  onClick('finishBtn', finishForTime);
  $('bigWrap').addEventListener('click', toggle);

  // ---------- 시작 화면 "Are You Ready?" ----------
  // 깜빡임: 0.7초마다 위/아래 색 맞바꿈 → 초당 약 1.4회 (광과민성 기준 초당 3회 미만)
  // '동작 줄이기' 설정 시: 4초마다 3초에 걸쳐 천천히 색 전환
  var BLINK_MS = 700, SLOW_MS = 4000;
  var blinkTimer = null;
  var reduceMQ = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
  function startBlink() {
    stopBlink();
    var slow = !!(reduceMQ && reduceMQ.matches);
    $('ready').classList.toggle('slow', slow);
    blinkTimer = setInterval(function () { $('ready').classList.toggle('swap'); }, slow ? SLOW_MS : BLINK_MS);
  }
  function stopBlink() { if (blinkTimer) { clearInterval(blinkTimer); blinkTimer = null; } }
  if (reduceMQ) {
    var onMotionPref = function () { if (!$('ready').hidden) startBlink(); };
    if (reduceMQ.addEventListener) reduceMQ.addEventListener('change', onMotionPref); else if (reduceMQ.addListener) reduceMQ.addListener(onMotionPref);
  }
  function showReady() {
    $('bye').hidden = true; $('setup').hidden = true; $('run').hidden = true;
    $('ready').hidden = false; startBlink();
  }
  function enterApp() {
    unlockAudio(); // 이 누름으로 소리 활성화
    stopBlink();
    $('ready').hidden = true; $('setup').hidden = false;
    renderPreview();
  }
  function sayNo() {
    stopBlink();
    try { window.close(); } catch (e) {} // 대부분의 브라우저/홈 화면 앱은 막음
    setTimeout(function () {
      if (window.closed || $('ready').hidden) return; // 닫혔거나 그 사이 화면을 눌러 들어간 경우
      $('ready').hidden = true; $('bye').hidden = false;
    }, 300);
  }
  $('ready').addEventListener('click', enterApp);
  $('noBtn').addEventListener('click', function (ev) { ev.stopPropagation(); sayNo(); });
  $('bye').addEventListener('click', showReady);

  // ---------- 키보드 ----------
  document.addEventListener('keydown', function (ev) {
    // 시작 화면 / 작별 화면: Enter·스페이스 = 화면 누름, Esc = No
    if (!$('ready').hidden) {
      if (ev.target === $('noBtn')) return; // No 버튼에 포커스가 있으면 버튼 기본 동작
      if (ev.key === 'Enter' || ev.code === 'Space') { ev.preventDefault(); enterApp(); }
      else if (ev.key === 'Escape') { ev.preventDefault(); sayNo(); }
      return;
    }
    if (!$('bye').hidden) {
      if (ev.key === 'Enter' || ev.code === 'Space') { ev.preventDefault(); showReady(); }
      return;
    }
    var tag = ev.target && ev.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (ev.ctrlKey || ev.metaKey || ev.altKey || ev.repeat) return;
    var onRun = !$('run').hidden;
    if (ev.code === 'Space' || ev.key === ' ') {
      ev.preventDefault();
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      if (onRun) toggle(); else { readFields(); showRun(); }
    } else if (ev.code === 'KeyR') {
      if (onRun) { ev.preventDefault(); reset(); }
    } else if (ev.code === 'KeyF') {
      ev.preventDefault(); toggleFullscreen();
    }
  });

  // ---------- 오프라인(서비스 워커) + 새 버전 반영 ----------
  // 새 버전 확인 시점: 앱을 열 때 + 홈 화면 앱이 다시 앞으로 나올 때.
  // 새 버전이 설치되면 설정 화면에서는 바로 새로고침, 운동 중이면 설정 화면으로 돌아올 때 새로고침.
  var pendingReload = false;
  function showVersion() {
    if (!window.caches) return;
    caches.keys().then(function (keys) {
      var k = keys.filter(function (x) { return x.indexOf('wod-timer-') === 0; }).pop();
      $('verText').textContent = k ? '버전 ' + k.replace('wod-timer-', '') + ' · 오프라인 사용 가능' : '';
    }).catch(function () {});
  }
  function reloadForUpdate() {
    // 업데이트 새로고침 뒤에는 시작 화면을 건너뛰고 원래 보던 설정 화면으로
    try { if ($('ready').hidden && $('bye').hidden) sessionStorage.setItem('wodTimer.skipReady', '1'); } catch (e) {}
    location.reload();
  }
  function applyUpdate() {
    if ($('run').hidden) reloadForUpdate();
    else pendingReload = true;
  }
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    var hadController = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(function (reg) {
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') reg.update().catch(function () {});
      });
    }).catch(function () {});
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (hadController) applyUpdate(); // 첫 설치 때는 새로고침하지 않음
      hadController = true;
      showVersion();
    });
    navigator.serviceWorker.ready.then(showVersion);
  } else {
    $('verText').textContent = '파일로 직접 연 상태 (오프라인 저장은 웹 주소로 열 때만 동작)';
  }

  // 아이폰처럼 전체 화면 기능이 없는 기기에서는 버튼 숨김 (홈 화면 앱은 이미 주소창 없이 열림)
  if (!(document.fullscreenEnabled || document.webkitFullscreenEnabled)) $('fsBtn').hidden = true;

  renderSound();
  renderSetup();
  var skipReady = false;
  try { skipReady = sessionStorage.getItem('wodTimer.skipReady') === '1'; sessionStorage.removeItem('wodTimer.skipReady'); } catch (e) {}
  if (skipReady) { $('ready').hidden = true; $('setup').hidden = false; }
  else startBlink();

  // 테스트/디버그용 (화면 동작에는 영향 없음)
  window.wodDebug = { beepLog: beepLog, state: function () { return { status: T.status, elapsed: elapsed() }; },
                      audioState: function () { return actx ? actx.state : 'none'; } };
})();
</script>
</body>
